name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest pytest-asyncio pytest-cov
        # Install grammars for tests
        pip install tree-sitter-python tree-sitter-javascript

    - name: Run unit tests with coverage
      run: |
        pytest tests/ --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies and linting tools
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install prospector[with_mypy,with_bandit,with_vulture]
        # Install grammars and types for linting
        pip install tree-sitter-python tree-sitter-javascript types-aiofiles

    - name: Run Prospector audit
      run: |
        prospector code_rag --profile .prospector.yaml --with-tool mypy --with-tool bandit

    - name: Run Vulture dead code check
      run: |
        vulture code_rag --min-confidence 80 --exclude code_rag/core/models.py
