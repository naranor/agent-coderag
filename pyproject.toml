[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-rag"
version = "0.1.0"
description = "Semantic search and code distillation utility for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Igor Boloban <naranor@gmail.com>" }
]
keywords = ["semantic-search", "code-search", "rag", "llm", "embeddings", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
[project.urls]
Homepage = "https://github.com/naranor/code-rag"
Repository = "https://github.com/naranor/code-rag"
Issues = "https://github.com/naranor/code-rag/issues"

dependencies = [
    "duckdb",
    "numpy",
    "litellm",
    "onnxruntime",
    "tokenizers",
    "pydantic",
    "httpx",
    "aiofiles",
]

[project.scripts]
code-rag = "code_rag.entry.cli:main"

[tool.setuptools.packages.find]
include = ["code_rag*"]
