<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="100" rx="8" fill="url(#bg)"/>
  
  <!-- Code brackets -->
  <text x="30" y="65" font-family="monospace" font-size="40" fill="#e94560">&lt;</text>
  <text x="50" y="65" font-family="monospace" font-size="40" fill="#e94560">/</text>
  
  <!-- Agent text -->
  <text x="80" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff">Agent</text>
  <text x="155" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e94560">Code</text>
  <text x="220" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e94560">RAG</text>
  
  <!-- Subtitle -->
  <text x="80" y="70" font-family="Arial, sans-serif" font-size="12" fill="#888">Semantic Intelligence for AI Coding Agents</text>
  
  <!-- Decorative dots -->
  <circle cx="370" cy="30" r="4" fill="#e94560"/>
  <circle cx="380" cy="50" r="3" fill="#0f3460"/>
  <circle cx="365" cy="70" r="5" fill="#e94560"/>
</svg>