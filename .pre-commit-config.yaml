repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-json
    -   id: detect-private-key

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
    -   id: ruff
        args: [ --fix ]
    -   id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
    -   id: mypy
        additional_dependencies: [pydantic, types-requests, numpy, types-aiofiles]
        args: [--ignore-missing-imports]

-   repo: local
    hooks:
    -   id: prospector
        name: prospector
        entry: prospector
        language: system
        types: [python]
        args: [code_rag, --profile, .prospector.yaml, --with-tool, mypy, --with-tool, bandit]
        pass_filenames: false

    -   id: vulture
        name: vulture
        entry: vulture
        language: system
        types: [python]
        args: [code_rag, --min-confidence, "80", --exclude, code_rag/core/models.py]
        pass_filenames: false
